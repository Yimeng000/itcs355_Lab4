# Lab 4 — service level objectives.
#
# Most students write a target and stop. The third field is where the thinking is: an SLO
# without a stated response to exhaustion is a wish, not an objective.

service: itcs355-predict

objectives:
  - name: availability
    target: 0.995              # 99.5% balances reliability with the cost and scope of a student staging service.
    window: 30d
    measurement: "successful responses / total responses, excluding 4xx"
    on_budget_exhausted: |
      Freeze new deployments and roll back to the last known-good model version.
      Investigate 5xx errors before resuming deployment.

  - name: latency
    target_p95_ms: 500          # Matches the p95 latency target defined in loadtest/k6.js.
    window: 7d
    measurement: "p95 of /predict, measured at the endpoint, not at the client"
    on_budget_exhausted: |
      Freeze new deployments and investigate latency regressions.
      Roll back to the last known-good model version if p95 remains above 500 ms.

  - name: freshness
    target_max_model_age_days: 30
    window: continuous
    measurement: "days since the production model version was trained"
    on_budget_exhausted: |
      Trigger a model review and retraining workflow.
      Do not automatically deploy the new model until evaluation checks pass.
